# dsh-client-ui-model-clock profile patch layer
#
# 这个文件是「命令安装能否生效」的关键：`dsh plugin add` 只有在包的 package.json
# 声明了 `dsh.bundle.patch` 时，才会把本插件并入 profile 的 layer 栈；
# 否则它只被当成一个普通依赖装进去，**进程不会加载它**，用户会看到「装成功但没反应」。
#
# id 必须与 host 入口里的插件名一致（lib/index.js 中 `export const name = "model-clock"`）。
# name 是 npm 包名，dsh 由它同时解析出 host 入口（main）与 client 入口（exports["./client"]）。
- insert:
    - id: model-clock
      name: 'dsh-client-ui-model-clock'
